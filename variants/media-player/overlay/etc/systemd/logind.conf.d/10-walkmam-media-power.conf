# O app de mídia é dono do botão de power.
#
# Toque curto   = apaga/acende a tela (DPMS off, economiza bateria)
# 3 s segurando = abre a confirmação de desligar
#
# Sem isto o systemd-logind trata o rk805 pwrkey por conta própria
# (HandlePowerKey=poweroff é o padrão) e desliga o aparelho no toque, antes de o
# app ver a tecla. O logind continua no sistema para o resto; só não mexe mais
# nas teclas de energia — quem decide é o app.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
