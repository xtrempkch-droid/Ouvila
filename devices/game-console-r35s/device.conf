# Game Console R35S (R35S/R36S da Data Frog & clones) — Rockchip RK3326.
#
# ATENÇÃO: esta placa NÃO é RK3566 (família X55/X35S/X35H). O RK3326 é da
# família PX30: outro DTS (rk3326-*), outro U-Boot (mainline: odroid-go2) e
# outros blobs do rkbin (px30_bl31/px30_ddr). Por isso ela tem a SUA PRÓPRIA
# linha de CI: .github/workflows/build-rk3326.yml (a linha RK3566 continua em
# build.yml e não foi tocada). Contexto: docs/r35s-rk3326.md.
#
# Confirmado nos arquivos do aparelho (2026-10-30, ver §9 do doc): a unidade é
# painel "panel4", o DTB base que funciona é o rk3326-gameconsole-r36s.dtb
# (painel sitronix,st7703 + joypad rocknix-singleadc-joypad) e o painel é
# aplicado por overlay (FDTOVERLAYS /overlays/mipi-panel.dtbo), não por DTB
# próprio.
#
# Confirmado por console serial (2026-11-06, ver §12 do doc): o
# /proc/device-tree do aparelho diz "Game Console R36S" com compatible
# gameconsole,r35s + gameconsole,r36s + rockchip,rk3326 — esta placa é a mesma
# da R36S. O overlay de painel do repositório bate com o painel real (160
# entradas, 159 idênticas e uma com espaço duplo). O DTB lido do aparelho está
# em dts/referencia/ como fonte de comparação; o que o CI embarca continua
# sendo o oficial (tem __symbols__, necessário para o overlay).
id=game-console-r35s
model=Game Console R35S (RK3326)
status=ci-rk3326-aguardando-teste-em-hardware
# DTB base oficial da ROCKNIX, copiado para dts/ (sha256 b84245e6...). O CI usa
# OUVILA_DTB_SOURCE apontando para esse arquivo; não é compilado do kernel.
image_dtb=rk3326-gameconsole-r36s.dtb
# U-Boot mainline, para o modo loader=mainline do workflow (é o único defconfig
# rk3326 do mainline). ATENÇÃO: em teste no aparelho o loader mainline NÃO
# ligou (tela preta, §11 do doc) — o padrão do pipeline é loader=oficial, que
# usa os 16 MiB de loader da imagem da ROCKNIX.
uboot_defconfig=odroid-go2
# Painel 640x480 montado na horizontal. Medido no aparelho: o DRM reporta
# card0-DSI-1 "connected" com modos 640x480 e o modo preferido é o de 60 Hz
# (o de 75 Hz existe no DT, marcado sem default). Não há rotação a aplicar.
display_transform=normal
