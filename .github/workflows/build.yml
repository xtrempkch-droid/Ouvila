name: Build Mainline RK3566 (Powkiddy X55) OS

on:
  push:
    branches: [ "main" ]
    # Tag "retroarch-*" constrói a variante de jogos. Serve para gerar a imagem
    # sem depender do botão no navegador (e para marcar uma versão):
    #   git tag retroarch-v1 && git push origin retroarch-v1
    # Tag "v*" constrói a variante padrão (kodi) e publica um Release com o nome
    # da tag. Qualquer tag que também corresponda a "v*" vira release; as tags
    # "retroarch-*" também (ver os passos de publicação no fim do job).
    tags: [ "v*", "retroarch-*", "media-player-*" ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Variante da imagem (kodi = multimidia, retroarch = jogos, media-player = app de midia unico)"
        type: choice
        options:
          - kodi
          - retroarch
          - media-player
        default: kodi

# A variante escolhe quais pacotes/serviços entram no rootfs e o nome do
# artefato. Push na main constrói a padrão (kodi) para não quebrar o fluxo
# que já é usado para testar no aparelho.
env:
  VARIANT: ${{ github.event.inputs.variant || (startsWith(github.ref, 'refs/tags/retroarch-') && 'retroarch') || (startsWith(github.ref, 'refs/tags/media-player-') && 'media-player') || 'kodi' }}

# Um build por referencia: push novo na main cancela o anterior em vez de rodar
# dois kernels em paralelo (cada run leva ~40 min e o runner e o mesmo). Tags
# sao refs diferentes, entao o build da variante retroarch nao e cancelado por
# um push na main.
#
# ATENCAO ao ler o log de uma run cancelada: ela morre no meio do passo, sem
# mensagem de erro, e a ultima linha pode ser algo como "--> Compactando imagem
# final...". Isso NAO e falha: a run aparece como "cancelled" (nunca "failure") e
# o passo interrompido esta marcado como cancelled. Confira o numero do run: o
# mais novo da fila e o que vale.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Necessário para publicar a imagem no GitHub Releases. O restante do workflow
# só lê o repositório e baixa fontes externas.
permissions:
  contents: write

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          bison flex libssl-dev bc libncurses-dev kmod u-boot-tools \
          device-tree-compiler python3 python3-dev python3-pyelftools python3-setuptools \
          swig libelf-dev libgnutls28-dev rsync git wget \
          parted kpartx e2fsprogs dosfstools qemu-user-static debootstrap

    # Kernel mainline: rk3566-powkiddy-x55.dts existe a partir da tag v6.8.
    # Usamos uma tag estável recente que já contenha o suporte.
    - name: Testes do app de midia (variante media-player)
      # Roda ANTES de compilar o kernel: se a UI/biblioteca/decoder regredir, o
      # build falha em ~2 min em vez de descobrir depois de 40 min.
      #
      # Por que compilar nativo aqui: os testes abrem mídia de verdade e
      # desenham o canvas, então o binário precisa EXECUTAR no runner. O binário
      # arm64 é validado no passo do rootfs, rodando dentro dele com qemu.
      if: env.VARIANT == 'media-player'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
          libswresample-dev libdrm-dev libasound2-dev libfreetype-dev \
          libharfbuzz-dev \
          gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly
        ./build/media-player.sh --native
        bash tools/test-media-player.sh build/walkmam-media

    - name: Fetch Sources (Mainline U-Boot, Mainline Kernel & RKBIN)
      run: |
        # U-Boot fixado no commit que gerou a imagem validada (o master do denx
        # move e o defconfig pode deixar de bater).
        UBOOT_COMMIT=0a55b098d6f5f6bafa84fc2f18b433dd167bf729
        git init -q uboot
        git -C uboot remote add origin https://source.denx.de/u-boot/u-boot.git
        if git -C uboot fetch -q --depth 1 origin "$UBOOT_COMMIT"; then
          git -C uboot checkout -q --detach FETCH_HEAD
        else
          rm -rf uboot
          git clone -q --filter=blob:none --no-checkout https://source.denx.de/u-boot/u-boot.git uboot
          git -C uboot checkout -q --detach "$UBOOT_COMMIT"
        fi
        echo "--> U-Boot em $(git -C uboot rev-parse HEAD)"
        git clone --depth 1 --branch v6.12 https://github.com/torvalds/linux.git kernel
        # rkbin fixado: o master já removeu os blobs que o defconfig espera e o
        # fallback "mais recente" muda sem aviso. Este commit é o que gerou a
        # imagem validada (bl31 v1.46 / ddr v1.26 entram pelo fallback).
        RKBIN_COMMIT=3e288fe814e059dd06833495f845cab04ac20a5c
        git init -q rkbin
        git -C rkbin remote add origin https://github.com/rockchip-linux/rkbin.git
        if git -C rkbin fetch -q --depth 1 origin "$RKBIN_COMMIT"; then
          git -C rkbin checkout -q --detach FETCH_HEAD
        else
          echo "--> fetch por SHA falhou para o rkbin; usando clone rasos + checkout"
          rm -rf rkbin
          git clone -q --filter=blob:none --no-checkout https://github.com/rockchip-linux/rkbin.git rkbin
          git -C rkbin checkout -q --detach "$RKBIN_COMMIT"
        fi
        echo "--> rkbin em $(git -C rkbin rev-parse HEAD)"

    - name: Build Mainline U-Boot
      run: |
        cd uboot
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        # O mainline define BOOT_TARGETS como "mmc1 mmc0 nvme scsi usb pxe dhcp spi"
        # (include/configs/rockchip-common.h). Nas X35S/X35H existe um SEGUNDO slot
        # SD no mmc2 (mmc@fe000000), que assim nunca era tentado: um sistema
        # gravado nele nao iniciava. Definir BOOT_TARGETS aqui (antes do include
        # do rk3568_common.h) acrescenta o mmc2 mantendo a prioridade pedida:
        #   mmc1 = SD1 (e o slot usado para testar)
        #   mmc0 = eMMC (sistema "instalado"; vence o 2o slot)
        #   mmc2 = SD2 (cartao extra; so inicia se os outros nao tiverem sistema)
        python3 - <<'PATCH_UBOOT'
        p = 'include/configs/powkiddy-x55-rk3566.h'
        src = open(p).read()
        if 'BOOT_TARGETS' in src:
            print('BOOT_TARGETS ja definido; nada a fazer')
        else:
            alvo = '#include <configs/rk3568_common.h>'
            novo = (
                '/* Walkmam: inclui o 2o slot SD (mmc2). Sem isto o mainline so\n'
                ' * varre "mmc1 mmc0" e um sistema no mmc2 nunca inicia.\n'
                ' */\n'
                '#define BOOT_TARGETS "mmc1 mmc0 mmc2 nvme scsi usb pxe dhcp spi"\n'
                '\n' + alvo
            )
            assert alvo in src, 'include do rk3568_common.h nao encontrado'
            open(p, 'w').write(src.replace(alvo, novo, 1))
            print('BOOT_TARGETS definido com mmc2')
        PATCH_UBOOT

        grep -n BOOT_TARGETS include/configs/powkiddy-x55-rk3566.h

        make powkiddy-x55-rk3566_defconfig

        # Versões de blob confirmadas no options da ROCKNIX para RK3566-X55
        # (projects/Rockchip/devices/RK3566-X55/options)
        BL31="../rkbin/bin/rk35/rk3568_bl31_v1.43.elf"
        TPL="../rkbin/bin/rk35/rk3566_ddr_1056MHz_v1.18.bin"

        if [ ! -f "$BL31" ] || [ ! -f "$TPL" ]; then
          echo "!!! Versão exata não encontrada no rkbin atual, usando a mais recente disponível como fallback:"
          BL31=$(ls ../rkbin/bin/rk35/rk3568_bl31_v*.elf | sort -V | tail -n1)
          TPL=$(ls ../rkbin/bin/rk35/rk3566_ddr_1056MHz_v*.bin | sort -V | tail -n1)
        fi
        echo "--> BL31=$BL31"
        echo "--> DDR/TPL=$TPL"

        make BL31="$BL31" ROCKCHIP_TPL="$TPL" -j"$(nproc)"

        echo "--> Artefatos gerados em uboot/:"
        ls -la idbloader.img u-boot.itb u-boot-rockchip.bin 2>/dev/null || true

    - name: Fetch ROCKNIX Config & Patches (RK3566 family - X55 / X35S / X35H)
      run: |
        # A ROCKNIX mantém, no próprio repositório open-source, o .config de
        # kernel e os patches/dts de device-tree já testados e funcionando
        # nessa família de placas. Buscamos aqui em vez de adivinhar.
        #
        # IMPORTANTE: diferente da X55 (que está no Linux mainline), a X35S/
        # X35H NUNCA foi enviada ao mainline — só existe como fonte própria da
        # ROCKNIX. Por isso a busca aqui é ampla (qualquer arquivo com "x35"
        # no nome, não só *.patch).
        # ROCKNIX fixado: o master anda junto com o kernel deles (7.x). O patch
        # da X35S atual usa o label `&gpio_keys_control`, que NÃO existe no DTS
        # da X55 do mainline 6.12 -> o dtbs falha. Este commit é o estado que
        # gerou a imagem validada (#89) e aplica os dois patches limpos.
        ROCKNIX_COMMIT=8c081eb645f8f9a9fc59fe0c8c7927ce79d5192c
        git init -q rocknix-src
        git -C rocknix-src remote add origin https://github.com/ROCKNIX/distribution.git
        if git -C rocknix-src fetch -q --depth 1 origin "$ROCKNIX_COMMIT"; then
          git -C rocknix-src checkout -q --detach FETCH_HEAD
        else
          echo "--> fetch por SHA falhou para a ROCKNIX; usando clone raso + checkout"
          rm -rf rocknix-src
          git clone -q --filter=blob:none --no-checkout https://github.com/ROCKNIX/distribution.git rocknix-src
          git -C rocknix-src checkout -q --detach "$ROCKNIX_COMMIT"
        fi
        echo "--> ROCKNIX em $(git -C rocknix-src rev-parse HEAD)"

        echo "--> Localizando linux.aarch64.conf (RK3566, comum a toda a família)..."
        ROCKNIX_KCONFIG=$(find rocknix-src -path '*RK3566*/linux/linux.aarch64.conf' | head -n1)
        echo "Encontrado: $ROCKNIX_KCONFIG"
        cp "$ROCKNIX_KCONFIG" rocknix-kernel.config

        echo "--> Localizando QUALQUER arquivo relacionado a X55/X35S no repositório inteiro..."
        mkdir -p rocknix-patches rocknix-dts
        # (sem restringir a caminhos com "linux" — a ROCKNIX guarda config de
        # cada aparelho em pastas como devices/RK3566-X55/, sem essa palavra)
        find rocknix-src \( -iname '*x55*' -o -iname '*x35*' \) -type f | sort | tee /tmp/x35-files.txt

        echo "--> Conteúdo do arquivo 'options' da X35S/X35H (confirma o nome real do .dtb esperado)..."
        X35_OPTIONS=$(grep -i 'x35' /tmp/x35-files.txt | grep -i 'options$' | head -n1)
        if [ -n "$X35_OPTIONS" ]; then
          echo "Arquivo: $X35_OPTIONS"
          cat "$X35_OPTIONS"
        else
          echo "Nenhum arquivo 'options' específico de X35S/X35H encontrado."
        fi

        # Separa por tipo: patches vão para aplicar com git apply,
        # .dts/.dtsi novos vão direto para dentro da árvore do kernel.
        while read -r f; do
          case "$f" in
            *.patch) cp "$f" rocknix-patches/ ;;
            *.dts|*.dtsi) cp "$f" rocknix-dts/ ;;
          esac
        done < /tmp/x35-files.txt

        echo "--> Patches encontrados:"; ls -la rocknix-patches/ 2>/dev/null
        echo "--> Arquivos .dts/.dtsi encontrados:"; ls -la rocknix-dts/ 2>/dev/null

        echo "--> Localizando o driver compartilhado panel-generic-dsi.c (usado por RK3326/RK3566/RK3576)..."
        # Esse driver NÃO fica na pasta do dispositivo (não tem "x35"/"x55" no
        # nome) — é injetado direto pelo script de build deles a partir de um
        # local comum em projects/ROCKNIX/packages/linux/.
        GENERIC_DSI_C=$(find rocknix-src -iname 'panel-generic-dsi.c' | head -n1)
        echo "Encontrado: $GENERIC_DSI_C"
        if [ -n "$GENERIC_DSI_C" ]; then
          cp "$GENERIC_DSI_C" rocknix-panel-generic-dsi.c
        fi

        echo "--> Localizando o package.mk do kernel da ROCKNIX (mostra como eles registram o driver)..."
        LINUX_PKGMK=$(find rocknix-src -path '*packages/linux/package.mk' | head -n1)
        echo "Encontrado: $LINUX_PKGMK"
        if [ -n "$LINUX_PKGMK" ]; then
          echo "--> Trecho relevante (post_patch / panel-generic-dsi / joypad):"
          grep -n -B2 -A20 'generic-dsi\|post_patch\|joypad' "$LINUX_PKGMK" | head -n 150
          cp "$LINUX_PKGMK" rocknix-linux-package.mk
        fi

        echo "--> Baixando a revisão do driver rocknix-joypad usada para adaptar o X55."
        git init rocknix-joypad-src
        git -C rocknix-joypad-src fetch --depth 1 \
          https://github.com/ROCKNIX/rocknix-joypad.git \
          d02ed13aae08113f6f9e0e9d699cb29bb3450fa2
        git -C rocknix-joypad-src checkout --detach FETCH_HEAD
        ls -la rocknix-joypad-src/ 2>/dev/null

    - name: Build Mainline Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        echo "--> Aplicando patches de DTS da X55/X35S (SDIO fix / overclock / etc)..."
        for p in ../rocknix-patches/*.patch; do
          [ -f "$p" ] || continue
          echo "Aplicando $p"
          git apply --reject --whitespace=fix "$p" || echo "!!! Falhou ao aplicar $p, verifique manualmente (pode já não bater com esta versão do kernel)."
        done

        # Patch rejeitado deixa .rej e um .dts inconsistente (ex.: label que não
        # existe no mainline) que só quebra lá no `make dtbs`. Falha aqui, claro.
        REJ=$(find arch/arm64/boot/dts/rockchip -name '*.rej' 2>/dev/null)
        if [ -n "$REJ" ]; then
          echo "!!! Patches de DTS rejeitados (a ROCKNIX mudou?):" >&2
          echo "$REJ" >&2
          echo "!!! Nao continue: o .dts resultante referencia labels inexistentes no mainline." >&2
          exit 1
        fi

        echo "--> Garantindo que todo .dts novo (via patch ou cópia direta) está registrado no Makefile..."
        # Copia primeiro os .dts/.dtsi que vieram soltos (não via patch)
        if ls ../rocknix-dts/*.dts* >/dev/null 2>&1; then
          cp ../rocknix-dts/*.dts* arch/arm64/boot/dts/rockchip/
        fi

        MAKEFILE="arch/arm64/boot/dts/rockchip/Makefile"
        for dtsfile in arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35*.dts \
                       arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts; do
          [ -f "$dtsfile" ] || continue
          base=$(basename "$dtsfile" .dts)
          if grep -q "${base}\.dtb" "$MAKEFILE"; then
            echo "--> ${base}.dtb já registrado no Makefile"
          else
            echo "--> Registrando ${base}.dtb no Makefile do rockchip (não estava lá — provavelmente veio via patch que só adiciona o .dts)"
            echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += ${base}.dtb" >> "$MAKEFILE"
          fi
        done

        echo "--> Normalizando a configuração do joypad do X55 para um único nó ROCKNIX."
        python3 ../build/configure-x55-dts.py arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts
        if ! grep -q $'^\tjoypad: rocknix-joypad {' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts; then
          echo "O nó rocknix-joypad precisa ser filho direto da raiz do device tree." >&2
          exit 1
        fi
        if grep -q $'^\t\tjoypad: rocknix-joypad {' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts; then
          echo "O nó rocknix-joypad não pode ficar aninhado em outro dispositivo." >&2
          exit 1
        fi

        echo "--> A X35S/X35H não tem porta HDMI física — desabilitando o nó HDMI do SoC no"
        echo "--> .dts antes de compilar (se ficasse habilitado, o Kodi em modo GBM poderia"
        echo "--> escolher esse conector 'fantasma' em vez do painel, deixando a tela preta)."
        if [ -f arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts ]; then
          printf '\n&hdmi {\n\tstatus = "disabled";\n};\n&hdmi_sound {\n\tstatus = "disabled";\n};\n' >> arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts
        fi

        echo "--> Desabilitando HDMI no X55 para testar o workaround de tela preta."
        echo "--> O hdmi_sound vai junto: com o HDMI desligado ele nunca encontra o codec"
        echo "--> e fica em 'deferred probe' para sempre (asoc-simple-card: parse error)."
        if [ -f arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts ]; then
          printf '\n&hdmi {\n\tstatus = "disabled";\n};\n&hdmi_sound {\n\tstatus = "disabled";\n};\n' >> arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts

          # Fontes: patches da ROCKNIX para RK3566 (aplicados aqui como override
          # no DTS da placa, que e equivalente e nao depende do contexto exato
          # do patch no mainline):
          #  - 0004-arm64-dts-rockchip-fix-wifi-sdio-errors.patch
          #  - 0021-arm64-dts-rockchip-fix-missing-dma-names.patch
          # Sem isso o RTL8821CS falha no boot: o Wi-Fi da timeouts de SDIO
          # (-110) no probe e o Bluetooth nao inicializa (uart1 sem dma-names).
          echo "--> Wi-Fi (sdmmc1): no-mmc/no-sd/sd-uhs-sdr50 (ROCKNIX 0004)."
          echo "--> Bluetooth (uart1): dma-names tx/rx (ROCKNIX 0021)."
          printf '%s\n' \
            '&sdmmc1 {' \
            '	no-mmc;' \
            '	no-sd;' \
            '	sd-uhs-sdr50;' \
            '};' \
            '' \
            '&uart1 {' \
            '	dma-names = "tx", "rx";' \
            '};' >> arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts
        fi

        echo "--> Checando modo da porta USB (precisa ser 'otg'/'peripheral', não fixo em 'host',"
        echo "--> pra podermos usar 'USB gadget ethernet' e fazer SSH sem WiFi/Bluetooth)..."
        grep -n 'dr_mode' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts || \
          echo "--> Nenhum 'dr_mode' explícito no .dts da X35S (provavelmente herda do .dtsi base — ok na maioria dos casos, a ROCKNIX confirma suporte a gadget nessa família)."

        echo "--> DIAGNÓSTICO: conteúdo COMPLETO do rk3566-powkiddy-x35s.dts (pra achar"
        echo "--> se existe nó de botões/analógico que não está sendo reconhecido, ou se"
        echo "--> realmente não existe no patch que a ROCKNIX nos deu):"
        cat -n arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts

        echo "--> Usando o .config real da ROCKNIX para RK3566 como base..."
        cp ../rocknix-kernel.config .config

        # O .config da ROCKNIX usa "@INITRAMFS_SOURCE@" como placeholder de
        # template, preenchido pelo build system deles (LibreELEC-based) antes
        # de compilar. Aqui não temos esse pipeline, e como usamos rootfs em
        # partição separada (não initramfs embutido), zeramos esse campo.
        ./scripts/config --set-str INITRAMFS_SOURCE ""

        make olddefconfig

        echo "--> Integrando o driver panel-generic-dsi.c (compartilhado, fora da árvore mainline)..."
        if [ -f ../rocknix-panel-generic-dsi.c ]; then
          cp ../rocknix-panel-generic-dsi.c drivers/gpu/drm/panel/panel-generic-dsi.c

          # Tenta descobrir o nome real da CONFIG_ que a ROCKNIX usa, lendo
          # do próprio package.mk deles em vez de chutar.
          GENERIC_DSI_CONFIG=""
          if [ -f ../rocknix-linux-package.mk ]; then
            GENERIC_DSI_CONFIG=$(grep -oP 'CONFIG_DRM_PANEL_\w*GENERIC\w*' ../rocknix-linux-package.mk | sort -u | head -n1)
          fi
          if [ -z "$GENERIC_DSI_CONFIG" ]; then
            GENERIC_DSI_CONFIG="CONFIG_DRM_PANEL_GENERIC_DSI"
            echo "!!! Não achei o nome exato da CONFIG no package.mk, usando o padrão: $GENERIC_DSI_CONFIG"
          else
            echo "--> Nome real encontrado no package.mk: $GENERIC_DSI_CONFIG"
          fi
          CFG_SYMBOL=${GENERIC_DSI_CONFIG#CONFIG_}

          if ! grep -q "config ${CFG_SYMBOL}$" drivers/gpu/drm/panel/Kconfig; then
            echo "--> Registrando ${CFG_SYMBOL} no Kconfig..."
            KCONFIG_BLOCK=$'\nconfig '"${CFG_SYMBOL}"$'\n\ttristate "Generic MIPI-DSI panel (ROCKNIX)"\n\tdepends on OF\n\tdepends on DRM_MIPI_DSI\n\tdepends on BACKLIGHT_CLASS_DEVICE\n\tselect DRM_KMS_HELPER\n\thelp\n\t  Driver generico de painel MIPI-DSI controlado via sequencia de\n\t  inicializacao declarada no device tree (panel_description).\n'
            if grep -q '^endmenu' drivers/gpu/drm/panel/Kconfig; then
              awk -v block="$KCONFIG_BLOCK" '/^endmenu/ && !done {print block; done=1} {print}' \
                drivers/gpu/drm/panel/Kconfig > /tmp/Kconfig.new
              mv /tmp/Kconfig.new drivers/gpu/drm/panel/Kconfig
            else
              printf '%s\n' "$KCONFIG_BLOCK" >> drivers/gpu/drm/panel/Kconfig
            fi
          else
            echo "--> ${CFG_SYMBOL} já estava no Kconfig"
          fi

          if ! grep -q "panel-generic-dsi.o" drivers/gpu/drm/panel/Makefile; then
            echo "--> Registrando no Makefile..."
            echo "obj-\$(${GENERIC_DSI_CONFIG}) += panel-generic-dsi.o" >> drivers/gpu/drm/panel/Makefile
          else
            echo "--> Já estava registrado no Makefile"
          fi

          echo "--> Habilitando ${GENERIC_DSI_CONFIG} no .config..."
          ./scripts/config --enable "$CFG_SYMBOL"
          make olddefconfig
        else
          echo "!!! panel-generic-dsi.c NÃO foi encontrado no repositório da ROCKNIX."
          echo "!!! Sem ele, o painel da X35S/X35H não vai inicializar (mesmo com o .dtb certo),"
          echo "!!! porque o compatible \"rocknix,generic-dsi\" não tem driver nenhum."
        fi

        echo "--> Integrando o driver de botões/analógico (rocknix-joypad)..."
        if [ ! -f ../rocknix-joypad-src/rocknix-joypad.c ]; then
          echo "Driver ROCKNIX joypad não foi baixado." >&2
          exit 1
        fi
        cp ../build/rocknix-input-polldev-compat.h include/linux/input-polldev.h
        mkdir -p drivers/input/joystick
        cp ../rocknix-joypad-src/rocknix-joypad.c \
           ../rocknix-joypad-src/rocknix-joypad.h \
           drivers/input/joystick/

        if ! grep -q '^config JOYSTICK_ROCKNIX$' drivers/input/joystick/Kconfig; then
          BLOCK=$'\nconfig JOYSTICK_ROCKNIX\n\ttristate "ROCKNIX joypad driver"\n\tdepends on INPUT && IIO\n\thelp\n\t  ROCKNIX gamepad driver for GPIO buttons and ADC axes.\n'
          awk -v block="$BLOCK" '/^endif/ && !done {print block; done=1} {print}' \
            drivers/input/joystick/Kconfig > /tmp/Kconfig.new
          mv /tmp/Kconfig.new drivers/input/joystick/Kconfig
        fi
        if ! grep -q 'rocknix-joypad.o' drivers/input/joystick/Makefile; then
          echo 'obj-$(CONFIG_JOYSTICK_ROCKNIX) += rocknix-joypad.o' >> \
            drivers/input/joystick/Makefile
        fi
        ./scripts/config --enable INPUT_JOYSTICK
        ./scripts/config --enable JOYSTICK_ROCKNIX
        make olddefconfig
        grep -qx 'CONFIG_INPUT_JOYSTICK=y' .config
        grep -qx 'CONFIG_JOYSTICK_ROCKNIX=y' .config

        # "make dtbs" compila TODOS os device trees da plataforma Rockchip de
        # uma vez (não é filtrado por defconfig) — então X55 e X35S saem
        # juntos aqui, sem precisar de nenhum passo extra.
        make -j"$(nproc)" Image dtbs modules

        echo "--> Verificando se os dtbs da X55 e X35S foram gerados:"
        find arch/arm64/boot/dts/rockchip -iname '*powkiddy-x55*' -o -iname '*powkiddy-x35s*'

        echo "--> USB: NÃO forçamos mais dr_mode. O gadget funciona no X55, que usa o"
        echo "--> padrão 'otg' do SoC (rk356x-base.dtsi); forçar 'peripheral' nos DTBs da"
        echo "--> X35S (o que este workflow fazia) era a única diferença de USB entre a"
        echo "--> imagem que funciona (X55) e a que falha (X35H)."
        X55_DTB_PATH=arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dtb
        if [ -f "$X55_DTB_PATH" ]; then
          echo "--> [USB] dr_mode no DTB da X55 (referência que funciona):"
          dtc -I dtb -O dts "$X55_DTB_PATH" 2>/dev/null | grep -A5 'usb@fcc00000' || true
        fi
        DTB_PATH=arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dtb
        if [ -f "$DTB_PATH" ]; then
          echo "--> [USB] dr_mode no NOSSO DTB da X35S (não modificado):"
          dtc -I dtb -O dts "$DTB_PATH" 2>/dev/null | grep -A5 'usb@fcc00000' || true
        fi

        echo "--> DIAGNÓSTICO: tudo relacionado a 'panel' no rk3566-powkiddy-x35s.dts"
        grep -n -i -B2 -A10 'panel' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts || echo "Nada com 'panel' encontrado."

        echo "--> DIAGNÓSTICO: tudo relacionado a 'dsi' no rk3566-powkiddy-x35s.dts"
        grep -n -i -B2 -A10 'dsi' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts || echo "Nada com 'dsi' encontrado."

        echo "--> DIAGNÓSTICO: TODAS as linhas 'compatible' do arquivo"
        grep -n 'compatible' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts

        echo "--> DIAGNÓSTICO: esse(s) compatible existe(m) em drivers/gpu/drm/panel/?"
        for c in $(grep -oP 'compatible\s*=\s*"\K[^"]+' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts); do
          echo "-- checando: $c"
          grep -rl "$c" drivers/gpu/drm/panel/ 2>/dev/null || echo "   !!! não encontrado em nenhum driver de painel"
        done

        echo "--> DIAGNÓSTICO: drivers de painel habilitados no .config final"
        grep -i "PANEL" .config | grep '=y\|=m'

        echo "--> DIAGNÓSTICO: drivers de entrada (botões/analógico) habilitados no .config"
        echo "--> (esperado: JOYSTICK_ADC e KEYBOARD_GPIO, usados pelo adc-joystick/gpio-keys"
        echo "--> que a família RK3566 usa pros botões físicos)"
        grep -iE "JOYSTICK_ADC|KEYBOARD_GPIO|KEYBOARD_ADC|INPUT_ADC_KEYS" .config

        echo "--> Garantindo (forçando) que os drivers de botão estão habilitados,"
        echo "--> já que sem rede no aparelho não dá pra checar e corrigir remotamente:"
        ./scripts/config --enable JOYSTICK_ADC
        ./scripts/config --enable KEYBOARD_GPIO
        ./scripts/config --enable KEYBOARD_ADC
        ./scripts/config --enable INPUT_JOYSTICK
        ./scripts/config --enable INPUT_EVDEV

        echo "--> Habilitando o I2S/TDM do Rockchip (CPU DAI do audio). O config da"
        echo "--> ROCKNIX traz SND_SOC_ROCKCHIP_I2S=y, mas o 'olddefconfig' no kernel"
        echo "--> mainline descarta o filho quando o pai nao esta setado; sem este driver"
        echo "--> o 'sound' da X55 fica em deferred probe e nao existe placa de som."
        ./scripts/config --enable SND_SOC_ROCKCHIP
        ./scripts/config --enable SND_SOC_ROCKCHIP_I2S
        ./scripts/config --enable SND_SOC_ROCKCHIP_I2S_TDM

        echo "--> Habilitando USB gadget ethernet (g_ether) pra SSH via cabo USB-C,"
        echo "--> já que a X35H não tem WiFi/Bluetooth:"
        ./scripts/config --enable USB_GADGET
        ./scripts/config --module USB_ETH
        ./scripts/config --enable USB_LIBCOMPOSITE
        ./scripts/config --enable USB_DWC3
        ./scripts/config --enable USB_DWC3_DUAL_ROLE
        ./scripts/config --enable USB_ROLE_SWITCH

        make olddefconfig
        # Falha cedo se o kconfig descartar o I2S/áudio (foi o que aconteceu antes).
        for sym in CONFIG_SND_SOC_ROCKCHIP CONFIG_SND_SOC_ROCKCHIP_I2S \
                   CONFIG_SND_SOC_ROCKCHIP_I2S_TDM CONFIG_SND_SOC_RK817 \
                   CONFIG_SND_SIMPLE_CARD; do
          grep -qx "$sym=y" .config || { echo "!!! $sym nao ficou habilitado no .config" >&2; exit 1; }
        done
        make -j"$(nproc)" Image modules

        if ! find arch/arm64/boot/dts/rockchip -iname '*powkiddy-x35s*' | grep -q .; then
          echo "!!! rk3566-powkiddy-x35s.dtb NÃO existe neste kernel (v6.12 mainline)."
          echo "!!! Isso confirma: suporte à X35S/X35H provavelmente não está upstream ainda,"
          echo "!!! só no fork/patches específicos da ROCKNIX. Sem esse .dtb, o U-Boot não"
          echo "!!! encontra o FDT e o aparelho fica com tela preta (nenhum 'sistema' visível)."
        fi

    - name: Fetch Official ROCKNIX .dtb (X35S) as authoritative reference
      run: |
        echo "--> Nosso .dts da X35S está incompleto (sem botões/analógico, USB com erro)."
        echo "--> Baixando o release oficial mais recente da ROCKNIX pra pegar o .dtb"
        echo "--> REAL e comprovadamente funcional que eles usam em produção."

        LATEST_JSON=$(curl -s https://api.github.com/repos/ROCKNIX/distribution/releases/latest)
        ASSET_URL=$(echo "$LATEST_JSON" | grep -oP '"browser_download_url":\s*"\K[^"]*RK3566[^"]*Specific\.img\.gz' | head -n1)
        echo "--> URL do asset encontrado: $ASSET_URL"

        if [ -z "$ASSET_URL" ]; then
          echo "!!! Não consegui achar o asset 'Specific' do RK3566 no release mais recente."
          echo "!!! Prosseguindo sem o .dtb de referência (fica só o nosso, incompleto)."
        else
          wget -q "$ASSET_URL" -O rocknix-release.img.gz
          gunzip -f rocknix-release.img.gz

          LOOP_DEV=$(sudo losetup -fP --show rocknix-release.img)
          sudo mkdir -p /mnt/rocknix-boot
          sudo mount "${LOOP_DEV}p1" /mnt/rocknix-boot

          echo "--> Procurando o .dtb da X35S dentro do release..."
          FOUND_DTB=$(sudo find /mnt/rocknix-boot -iname '*x35s*.dtb' | head -n1)
          echo "Encontrado: $FOUND_DTB"

          if [ -n "$FOUND_DTB" ]; then
            sudo cp "$FOUND_DTB" rocknix-official-x35s.dtb
            sudo chown $(id -u):$(id -g) rocknix-official-x35s.dtb

            echo "--> Decompilando pra inspeção (diagnóstico):"
            dtc -I dtb -O dts rocknix-official-x35s.dtb 2>/dev/null | grep -A3 -i 'joystick\|gpio-keys\|usbdrd\|usb2phy' | head -150

            echo "--> Esse .dtb tem DSI e HDMI habilitados ao mesmo tempo, competindo pelo"
            echo "--> mesmo VOP2 — isso trava a saída de vídeo (confirmado em teste real:"
            echo "--> 'Failed to register component: -517' + 'POST_BUF_EMPTY irq err at vp1')."
            echo "--> Desabilitando o nó hdmi@fe0a0000 e recompilando o .dtb:"
            dtc -I dtb -O dts -o rocknix-official-x35s.dts rocknix-official-x35s.dtb 2>/dev/null
            awk '
              /hdmi@fe0a0000[ \t]*\{/ { inblk=1; depth=1; print; next }
              inblk {
                n=gsub(/\{/,"{"); depth+=n
                n=gsub(/\}/,"}"); depth-=n
                if ($0 ~ /status = "okay";/) { sub(/status = "okay";/, "status = \"disabled\";") }
                print
                if (depth<=0) inblk=0
                next
              }
              { print }
            ' rocknix-official-x35s.dts > rocknix-official-x35s.dts.new
            mv rocknix-official-x35s.dts.new rocknix-official-x35s.dts
            dtc -I dts -O dtb -o rocknix-official-x35s.dtb rocknix-official-x35s.dts 2>&1 | tail -20
            echo "--> Confirmando que a mudança entrou:"
            dtc -I dtb -O dts rocknix-official-x35s.dtb 2>/dev/null | grep -A2 'hdmi@fe0a0000'

            echo "--> USB: NÃO forçamos dr_mode. Mantemos o valor do próprio .dtb (o SoC"
            echo "--> base usa 'otg', igual ao X55, onde o gadget funciona). O 'peripheral'"
            echo "--> que forçávamos aqui era a única diferença de USB entre as imagens."
            echo "--> [USB] dr_mode no .dtb oficial da ROCKNIX (não modificado):"
            dtc -I dtb -O dts rocknix-official-x35s.dtb 2>/dev/null | grep -A5 'usb@fcc00000' || true
          else
            echo "!!! .dtb da X35S não encontrado dentro do release (procure manualmente)."
            sudo find /mnt/rocknix-boot -iname '*.dtb' | sort
          fi

          sudo umount /mnt/rocknix-boot
          sudo losetup -d "$LOOP_DEV"
          # O .img da ROCKNIX tem ~1,4 GB e so serviu para tirar um .dtb. Deixar
          # isso no disco durante a criacao da imagem (3,5 GB) + gzip e desperdicio
          # de espaco no runner; apagar aqui e seguro e imediato.
          sudo rm -f rocknix-release.img
          echo "--> release da ROCKNIX removido do disco (1,4 GB liberados)"
        fi

    - name: Preflight da variante (falha em segundos, sem compilar)
      run: |
        echo "--> Variante: $VARIANT"
        case "$VARIANT" in
          kodi|retroarch|media-player) ;;
          *)
            echo "!!! variante desconhecida: $VARIANT" >&2
            echo "!!! validas: kodi, retroarch, media-player" >&2
            exit 1
            ;;
        esac
        LISTA="variants/$VARIANT/packages/$VARIANT.list"
        if [ ! -f "$LISTA" ]; then
          echo "!!! manifesto de pacotes ausente: $LISTA" >&2
          exit 1
        fi

        # Valida cada nome contra o indice da ARQUITETURA. Nao use
        # packages.debian.org/<suite>/arm64/<pkg>: ele responde 200 mesmo
        # quando o pacote nao existe para arm64, e isso ja custou um build.
        echo "--> Baixando o indice arm64 do bookworm para validar $LISTA..."
        curl -fsSL http://deb.debian.org/debian/dists/bookworm/main/binary-arm64/Packages.gz \
          -o /tmp/pkgs-arm64.gz
        gzip -dc /tmp/pkgs-arm64.gz | sed -n 's/^Package: //p' | sort -u > /tmp/pkgs-arm64.txt
        echo "--> pacotes no indice: $(wc -l < /tmp/pkgs-arm64.txt)"

        PACOTES=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' "$LISTA" | grep -v '^$')
        echo "--> pacotes pedidos: $(printf '%s\n' "$PACOTES" | wc -l)"
        FALTANDO=0
        for p in $PACOTES; do
          if ! grep -qx "$p" /tmp/pkgs-arm64.txt; then
            echo "!!! $p NAO existe para arm64 no bookworm (veja $LISTA)" >&2
            FALTANDO=$((FALTANDO + 1))
          fi
        done
        if [ "$FALTANDO" -gt 0 ]; then
          echo "!!! $FALTANDO pacote(s) invalido(s) para arm64; abortando ANTES do build." >&2
          exit 1
        fi
        echo "--> ok: todos os pacotes existem para arm64"

        # Arquivos que o build vai instalar precisam existir no repositorio.
        for f in \
          "variants/$VARIANT/overlay/etc/systemd/system/$VARIANT.service" \
          "variants/$VARIANT/overlay/usr/local/bin/start-$VARIANT"*.sh \
        ; do
          case "$f" in *'*'*) continue;; esac
          if [ ! -e "$f" ]; then
            echo "!!! esperado e nao encontrado: $f" >&2
            exit 1
          fi
        done
        if [ "$VARIANT" = "retroarch" ] && [ ! -f \
             "variants/retroarch/overlay/root/.config/retroarch/autoconfig/udev/Rocknix_Gamepad.cfg" ]; then
          echo "!!! perfil de controle (autoconfig) ausente: sem ele o joypad nao responde" >&2
          exit 1
        fi

        # A variante media-player é um binário C compilado no runner a partir de
        # variants/media-player/src. O preflight confere as fontes aqui (segundos)
        # em vez de descobrir no meio do build do kernel.
        if [ "$VARIANT" = "media-player" ]; then
          for f in variants/media-player/src/*.c variants/media-player/src/*.h; do
            if [ ! -s "$f" ]; then
              echo "!!! fonte ausente ou vazia: $f" >&2
              exit 1
            fi
          done
          if [ ! -x build/media-player.sh ]; then
            echo "!!! build/media-player.sh ausente ou sem permissao" >&2
            exit 1
          fi
          for f in \
            variants/media-player/overlay/etc/systemd/system/media-player.service \
            variants/media-player/overlay/etc/systemd/logind.conf.d/10-walkmam-media-power.conf \
            variants/media-player/overlay/usr/local/bin/start-media-player.sh \
          ; do
            if [ ! -e "$f" ]; then
              echo "!!! esperado e nao encontrado: $f" >&2
              exit 1
            fi
          done
          echo "--> ok: fontes e overlay do media-player presentes"
        fi
        echo "--> ok: arquivos da variante presentes"

    - name: Build Minimal RootFS (Debian ARM64)
      run: |
        LINUX_FW_TAG=20260309
        echo "--> Criando RootFS base Debian ARM64..."
        sudo debootstrap --arch=arm64 --foreign bookworm rootfs http://deb.debian.org/debian/
        sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
        sudo chroot rootfs /debootstrap/debootstrap --second-stage

        echo "--> Pacotes básicos + acesso via console serial..."
        sudo chroot rootfs bash -c '
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            systemd-sysv udev ifupdown network-manager \
            openssh-server sudo nano \
            wpasupplicant iw wireless-tools rfkill bluez busybox
          echo "root:root" | chpasswd
          echo "rk3566-x55" > /etc/hostname
        '

        echo "--> Firmwares do Wi-Fi/BT do X55 (RTL8821CS)."
        echo "--> O kernel pede rtw88/rtw8821c_fw.bin e rtl_bt/rtl8821cs_fw.bin."
        echo "--> Nao vem no Debian: baixamos do linux-firmware, fixado na tag $LINUX_FW_TAG,"
        echo "--> e conferimos o sha256."
        echo "-->"
        echo "--> O rtl_bt/rtl8821cs_config.bin NAO existe no linux-firmware. Usar o"
        echo "--> rtl8821c_config.bin renomeado (10 bytes) NAO funciona: ele nao tem a"
        echo "--> entrada 0x0c (UART) e o btrtl aborta com 'no UART config entry found',"
        echo "--> deixando o hci0 sem endereco ('No default controller available')."
        echo "--> Geramos o config aqui: assinatura 0x8723ab55 + uma entrada de offset"
        echo "--> 0x0c com 16 bytes, baudrate 0x04928002 (1500000) e data[12]=0x5f"
        echo "--> (bit2 = flow control, casa com o 'uart-has-rtscts' do uart1)."
        FW_BASE="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain"
        fetch_fw() {
          url=$1; dest=$2; want=$3
          curl -fsSL "$url" -o /tmp/fwfile
          got=$(sha256sum /tmp/fwfile | cut -d" " -f1)
          if [ "$got" != "$want" ]; then
            echo "!!! sha256 inesperado para $dest: $got (esperado $want)" >&2
            exit 1
          fi
          sudo install -D -m 0644 /tmp/fwfile "rootfs/lib/firmware/$dest"
          echo "--> $dest ok"
        }
        fetch_fw "$FW_BASE/rtw88/rtw8821c_fw.bin?h=$LINUX_FW_TAG" \
          rtw88/rtw8821c_fw.bin 2ef409bc418549fcf294061dd0cae1fc22fd9da79b60524950b25de18732f3f0
        fetch_fw "$FW_BASE/rtl_bt/rtl8821cs_fw.bin?h=$LINUX_FW_TAG" \
          rtl_bt/rtl8821cs_fw.bin 3baa2eeaa43c959054687a67771e7435e73b2ff3e79dfb765121d8b7dc719391
        printf '\x55\xab\x23\x87\x13\x00\x0c\x00\x10\x02\x80\x92\x04\x50\xc5\xea\x19\xe1\x1b\xfd\xaf\x5f\x01\xa4\x0b' \
          | sudo tee rootfs/lib/firmware/rtl_bt/rtl8821cs_config.bin >/dev/null
        got=$(sha256sum rootfs/lib/firmware/rtl_bt/rtl8821cs_config.bin | cut -d" " -f1)
        if [ "$got" != "6ddeb15f23588053e00cb08d25588bd7cf98d60fa93d9478efcef4ae8064a7ac" ]; then
          echo "!!! rtl8821cs_config.bin inesperado: $got" >&2; exit 1
        fi
        echo "--> rtl_bt/rtl8821cs_config.bin ok (gerado, 25 bytes)"

        echo "--> Habilitando bluetooth e o painel web de gerenciamento (Wi-Fi/BT)..."
        sudo chroot rootfs systemctl enable bluetooth.service

        echo "--> Liberando login do root por senha no SSH."
        echo "--> (O Debian 12 vem com 'PermitRootLogin prohibit-password': sem isto,"
        echo "--> o login do root por senha é recusado mesmo com a senha certa.)"
        sudo mkdir -p rootfs/etc/ssh/sshd_config.d
        sudo bash -c 'cat << "EOF" > rootfs/etc/ssh/sshd_config.d/10-walkmam.conf
        # Login do root por senha, para depuração via cabo USB (g_ether).
        PermitRootLogin yes
        PasswordAuthentication yes
        EOF'
        sudo chmod 0644 rootfs/etc/ssh/sshd_config.d/10-walkmam.conf

        echo "--> Habilitando login automático no console serial (ttyS2)..."
        sudo mkdir -p rootfs/etc/systemd/system/serial-getty@ttyS2.service.d
        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/serial-getty@ttyS2.service.d/autologin.conf
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin root --keep-baud 1500000,115200,38400,9600 %I $TERM
        EOF'

        echo "--> tty1 pertence ao Kodi: mascarando o getty@tty1."
        echo "--> O kodi.service declara 'Conflicts=getty@tty1.service' e usa TTYPath=/dev/tty1."
        echo "--> Com o getty também habilitado no tty1, os dois disputam a unidade no boot e um"
        echo "--> dos dois leva SIGTERM: aparece 'Kodi (wayland) terminou com status 143' e o"
        echo "--> serviço reinicia em ciclo. Mascarar o getty resolve a disputa e preserva as"
        echo "--> mensagens que o launcher escreve em /dev/tty1 quando o Kodi não sobe."
        echo "--> Shell continua disponível no console serial (ttyS2, autologin do root)."
        sudo chroot rootfs systemctl mask getty@tty1.service

        echo "--> Instalando o servico de armazenamento extra (2o slot SD / cartao"
        echo "--> que nao tem o sistema). Monta em /storage/sdcard<N> e liga em"
        echo "--> /boot/roms/sdcard<N>, que o RetroArch ja mostra no navegador."
        sudo install -D -m 0755 \
          common/overlay/usr/local/bin/walkmam-extra-storage.sh \
          rootfs/usr/local/bin/walkmam-extra-storage.sh
        sudo install -D -m 0644 \
          common/overlay/etc/systemd/system/walkmam-extra-storage.service \
          rootfs/etc/systemd/system/walkmam-extra-storage.service
        sudo chroot rootfs systemctl enable walkmam-extra-storage.service

        echo "--> Instalando o utilitario de gravar a imagem no eMMC (opcional,"
        echo "--> manual). Confere o tamanho antes de escrever: o eMMC tem 3776 MiB."
        sudo install -D -m 0755 \
          tools/install-image-to-emmc.sh \
          rootfs/usr/local/bin/install-image-to-emmc.sh

        echo "--> Instalando o script de diagnóstico (dmesg, USB, input) no cartão SD"
        echo "--> a cada boot — assim dá pra ler no PC sem precisar de serial/rede/solda."
        echo "--> (o script vem de variants/kodi/overlay; não é mais copiado inline aqui)"
        sudo install -D -m 0755 \
          variants/kodi/overlay/usr/local/bin/dump-diagnostico.sh \
          rootfs/usr/local/bin/dump-diagnostico.sh

        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/dump-diagnostico.service
        [Unit]
        Description=Salva diagnostico de boot no cartao SD (boot partition)
        After=multi-user.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/dump-diagnostico.sh

        [Install]
        WantedBy=multi-user.target
        EOF'
        sudo chroot rootfs systemctl enable dump-diagnostico.service

        echo "--> Criando serviço que ativa o USB gadget ethernet no boot (g_ether),"
        echo "--> já que o driver estava habilitado no kernel mas nunca era carregado."
        sudo bash -c 'cat << "EOF" > rootfs/usr/local/bin/setup-usb-gadget.sh
        #!/bin/sh
        # g_ether cria a interface usb0 sozinho ao carregar, sem precisar
        # montar configfs manualmente. host_addr/dev_addr fixos evitam MAC
        # aleatório (facilita configurar o lado do PC, se precisar).
        modprobe g_ether dev_addr=02:00:00:00:00:01 host_addr=02:00:00:00:00:02
        sleep 2
        ip link set dev usb0 up 2>/dev/null || true
        ip addr add 10.55.0.1/24 dev usb0 2>/dev/null || true
        EOF'
        sudo chmod +x rootfs/usr/local/bin/setup-usb-gadget.sh

        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/usb-gadget.service
        [Unit]
        Description=USB Ethernet Gadget (g_ether) para SSH via cabo USB-C
        After=sys-kernel-config.mount
        Before=ssh.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/setup-usb-gadget.sh
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        EOF'
        sudo chroot rootfs systemctl enable usb-gadget.service

        echo "--> Impedindo o NetworkManager de gerenciar a usb0 (senão ele pode"
        echo "--> sobrescrever o IP fixo que o script de gadget configurou)."
        sudo mkdir -p rootfs/etc/NetworkManager/conf.d
        sudo bash -c 'cat << "EOF" > rootfs/etc/NetworkManager/conf.d/99-unmanaged-usb0.conf
        [keyfile]
        unmanaged-devices=interface-name:usb0
        EOF'

        echo "--> Garantindo que a partição de boot (FAT) esteja montada em /boot no sistema,"
        echo "--> senão o script acima não tem onde escrever:"
        sudo bash -c 'echo "LABEL=BOOT /boot vfat defaults 0 0" >> rootfs/etc/fstab'
        sudo mkdir -p rootfs/boot

        echo "--> Variante desta imagem: $VARIANT"

        # Helper compartilhado de display (rotação + start do Weston). É fonte
        # única dessa lógica; as variantes o consomem em vez de copiar.
        echo "--> Instalando o helper compartilhado de display (rotação/Weston)..."
        sudo install -D -m 0644 \
          common/overlay/usr/local/share/walkmam/display.sh \
          rootfs/usr/local/share/walkmam/display.sh

        if [ "$VARIANT" = "kodi" ]; then
          echo "--> [kodi] Instalando Kodi (GBM, sem X11) e dependências gráficas/áudio..."
          sudo chroot rootfs bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y --no-install-recommends \
              kodi kodi-bin kodi-peripheral-joystick \
              weston \
              libgl1-mesa-dri libegl-mesa0 libgbm1 libgles2 libinput10 \
              evtest \
              alsa-utils dbus ca-certificates
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          '

          echo "--> [kodi] Instalando o mapa de controles do gamepad ROCKNIX do X55..."
          sudo install -D -m 0644 \
            variants/kodi/overlay/usr/share/kodi/addons/peripheral.joystick/resources/buttonmaps/xml/linux/retrogame_joypad_17b_4a.xml \
            rootfs/usr/share/kodi/addons/peripheral.joystick/resources/buttonmaps/xml/linux/retrogame_joypad_17b_4a.xml

          echo "--> [kodi] Serviço Kodi em Weston/Wayland sobre DRM no tty1..."
          sudo install -D -m 0755 \
            variants/kodi/overlay/usr/local/bin/start-kodi-wayland.sh \
            rootfs/usr/local/bin/start-kodi-wayland.sh
          sudo install -D -m 0644 \
            variants/kodi/overlay/etc/systemd/system/kodi.service \
            rootfs/etc/systemd/system/kodi.service
          sudo install -D -m 0644 \
            variants/kodi/overlay/etc/xdg/weston/weston.ini \
            rootfs/etc/xdg/weston/weston.ini
          sudo chroot rootfs kodi.bin --help 2>&1 | grep -i 'windowing' || \
            echo "(Não foi possível confirmar via --help; a sessão será iniciada em Wayland.)"
          sudo chroot rootfs systemctl enable kodi.service

          echo "--> [kodi] Instalando o add-on Walkmam Radio (Wi-Fi/Bluetooth no Kodi)..."
          echo "--> O Kodi 20 no Linux NAO tem gerenciador de radio (o de Wi-Fi so"
          echo "--> existe nos builds Windows/Android), entao o add-on chama o"
          echo "--> nmcli (NetworkManager) e o bluetoothctl (BlueZ) direto."
          echo "--> Fica em Add-ons > Add-ons de programas > Walkmam Radio."
          sudo mkdir -p rootfs/usr/share/kodi/addons/script.walkmam.radio
          sudo install -D -m 0644 \
            variants/kodi/overlay/usr/share/kodi/addons/script.walkmam.radio/addon.xml \
            rootfs/usr/share/kodi/addons/script.walkmam.radio/addon.xml
          sudo install -D -m 0644 \
            variants/kodi/overlay/usr/share/kodi/addons/script.walkmam.radio/default.py \
            rootfs/usr/share/kodi/addons/script.walkmam.radio/default.py
          # O add-on e script Python: se nao compilar, o Kodi falha so na hora de
          # abrir. Checamos a sintaxe aqui para o build quebrar antes.
          python3 -m py_compile \
            variants/kodi/overlay/usr/share/kodi/addons/script.walkmam.radio/default.py \
            && echo "--> script.walkmam.radio: sintaxe Python ok" \
            || { echo "!!! default.py com erro de sintaxe" >&2; exit 1; }
        fi

        if [ "$VARIANT" = "retroarch" ]; then
          echo "--> [retroarch] Instalando RetroArch, assets e cores do Debian..."
          echo "--> A lista vem de variants/retroarch/packages/retroarch.list (uma por"
          echo "--> linha, # comenta), para não duplicar nomes de pacote no workflow."
          LISTA=variants/retroarch/packages/retroarch.list
          PACOTES=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' "$LISTA" | grep -v '^$' | tr '\n' ' ')
          echo "--> pacotes: $PACOTES"
          sudo chroot rootfs bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y --no-install-recommends '"$PACOTES"'
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          '

          echo "--> [retroarch] Conferindo o binário e descobrindo onde os cores caíram."
          echo "--> (O Debian instala em /usr/lib/<triple>/libretro; não chutamos o"
          echo "--> caminho: descobrimos e escrevemos o valor real no retroarch.cfg.)"
          RETROARCH_BIN=$(sudo chroot rootfs sh -c 'command -v retroarch' || true)
          if [ -z "$RETROARCH_BIN" ]; then
            echo "!!! retroarch nao foi instalado" >&2
            exit 1
          fi
          LIBRETRO_DIR=$(sudo chroot rootfs sh -c '
            for d in /usr/lib/*/libretro /usr/lib/libretro; do
              [ -d "$d" ] && { echo "$d"; exit 0; }
            done
            exit 1
          ')
          if [ -z "$LIBRETRO_DIR" ]; then
            echo "!!! diretorio de cores libretro nao encontrado no rootfs" >&2
            exit 1
          fi
          # No Debian os cores NAO sao *.so: vem como *.libretro
          # (/usr/lib/aarch64-linux-gnu/libretro/mgba.libretro). O RetroArch
          # aceita as duas extensoes; contar so *.so daria 0 e o build falharia
          # por um motivo falso.
          echo "--> retroarch: $RETROARCH_BIN | cores: $LIBRETRO_DIR"
          QTD_CORES=$(sudo chroot rootfs sh -c "ls -1 $LIBRETRO_DIR/*.libretro $LIBRETRO_DIR/*.so 2>/dev/null | wc -l")
          echo "--> cores instalados: $QTD_CORES"
          if [ "$QTD_CORES" -lt 5 ]; then
            echo "!!! poucos cores ($QTD_CORES): a lista de pacotes mudou?" >&2
            exit 1
          fi
          echo "--> amostra: $(sudo chroot rootfs sh -c "ls -1 $LIBRETRO_DIR/*.libretro $LIBRETRO_DIR/*.so 2>/dev/null | head -4 | xargs -n1 basename | tr '\n' ' '")"

          echo "--> [retroarch] Escrevendo o retroarch.cfg (com o caminho real dos cores)..."
          sudo mkdir -p rootfs/root/.config/retroarch
          # Barra final igual ao padrão do Debian (".../libretro/"). O valor vai
          # numa variável só: quando o sed usava "$LIBRETRO_DIR/" e a asserção
          # usava "$LIBRETRO_DIR", o grep não casava e o build abortava por causa
          # da própria checagem.
          LIBRETRO_DIR_CFG="$LIBRETRO_DIR/"
          CFG_HOST="rootfs/root/.config/retroarch/retroarch.cfg"
          # rootfs/root e modo 0700 (padrao do debootstrap). Sem sudo, o grep do
          # runner nao consegue NEM ATRAVESSAR o diretorio e responde
          # "Permission denied" — foi o que fez este build falhar com os pacotes
          # e os cores ja corretos instalados.
          sed "s|@LIBRETRO_DIR@|$LIBRETRO_DIR_CFG|" \
            variants/retroarch/overlay/etc/walkmam/retroarch.cfg \
            | sudo tee "$CFG_HOST" >/dev/null
          sudo chmod 0644 "$CFG_HOST"
          if ! sudo grep -qF "libretro_directory = \"$LIBRETRO_DIR_CFG\"" "$CFG_HOST"; then
            echo "!!! libretro_directory nao foi substituido no retroarch.cfg" >&2
            echo "!!! esperado: libretro_directory = \"$LIBRETRO_DIR_CFG\"" >&2
            sudo grep -n 'libretro_directory' "$CFG_HOST" >&2 || true
            exit 1
          fi
          if sudo grep -qF '@LIBRETRO_DIR@' "$CFG_HOST"; then
            echo "!!! sobrou placeholder @LIBRETRO_DIR@ no retroarch.cfg" >&2
            exit 1
          fi
          echo "--> retroarch.cfg ok: libretro_directory = \"$LIBRETRO_DIR_CFG\""

          # O pacote Debian do RetroArch 1.14 nao traz NENHUM perfil de joypad
          # (dpkg -L retroarch | grep autoconfig = vazio). Sem perfil o log diz
          # "[Autoconf]: retrogame_joypad (18507/4353) not configured" e nenhum
          # botao/analogico responde. Os numeros do perfil sao a POSICAO do botao
          # na enumeracao do driver udev, nao o codigo evdev.
          ACAO_CFG="variants/retroarch/overlay/root/.config/retroarch/autoconfig/udev/Rocknix_Gamepad.cfg"
          echo "--> [retroarch] Perfil do controle (autoconfig)..."
          sudo install -D -m 0644 "$ACAO_CFG" \
            rootfs/root/.config/retroarch/autoconfig/udev/Rocknix_Gamepad.cfg
          if ! sudo grep -qF 'input_device = "retrogame_joypad"' \
              rootfs/root/.config/retroarch/autoconfig/udev/Rocknix_Gamepad.cfg; then
            echo "!!! perfil do controle nao foi instalado" >&2
            exit 1
          fi

          echo "--> [retroarch] Diretórios de ROMs/saves/bios..."
          sudo mkdir -p rootfs/storage/roms \
            rootfs/storage/saves rootfs/storage/states \
            rootfs/storage/screenshots rootfs/storage/bios

          echo "--> [retroarch] Serviço no tty1 (Weston aplica a rotação)..."
          sudo install -D -m 0755 \
            variants/retroarch/overlay/usr/local/bin/start-retroarch.sh \
            rootfs/usr/local/bin/start-retroarch.sh
          sudo install -D -m 0644 \
            variants/retroarch/overlay/etc/systemd/system/retroarch.service \
            rootfs/etc/systemd/system/retroarch.service
          sudo chroot rootfs systemctl enable retroarch.service
        fi


        if [ "$VARIANT" = "media-player" ]; then
          echo "--> [media-player] App de midia unico (DRM/KMS + FFmpeg + ALSA)."
          echo "--> Nao ha Weston, navegador nem mpv: o binario walkmam-media e a"
          echo "--> camada inteira. As bibliotecas vem do manifesto da variante."
          LISTA=variants/media-player/packages/media-player.list
          PACOTES=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' "$LISTA" | grep -v '^$' | tr '\n' ' ')
          echo "--> pacotes: $PACOTES"
          sudo chroot rootfs bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y --no-install-recommends '"$PACOTES"'
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          '
          # Conferir o runtime de verdade: se faltar uma biblioteca, o binario
          # so falharia no aparelho, com "error while loading shared libraries".
          echo "--> [media-player] Conferindo as bibliotecas que o app usa..."
          if ! sudo chroot rootfs sh -c '
                for lib in libavformat libavcodec libavutil libswresample \
                           libswscale libdrm libasound libfreetype libharfbuzz; do
                  if ! ldconfig -p | grep -q "$lib\."; then
                    echo "faltando: $lib" >&2
                    exit 1
                  fi
                done
                [ -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ] || {
                  echo "faltando a fonte DejaVuSans.ttf" >&2; exit 1; }
                # Alfabetos que o app promete na tela de idioma: sem estas
                # fontes o texto sai como quadradinho vazio.
                for f in noto/NotoSansArabic-Regular.ttf \
                         noto/NotoSansDevanagari-Regular.ttf \
                         noto/NotoSansBengali-Regular.ttf \
                         wqy/wqy-zenhei.ttc; do
                  [ -r "/usr/share/fonts/truetype/$f" ] || {
                    echo "faltando a fonte $f" >&2; exit 1; }
                done
              '; then
            echo "!!! bibliotecas/fonte do media-player ausentes no rootfs" >&2
            exit 1
          fi
          echo "--> ok: bibliotecas e fonte presentes"

          echo "--> [media-player] Compilando o app (cross arm64, headers do bookworm)..."
          echo "--> Os cabeçalhos vem dos pacotes arm64 do proprio bookworm: e o"
          echo "--> que garante que o codigo compila contra o FFmpeg 5.1 da imagem"
          echo "--> (e nao contra a versao do runner). O script tambem confere que"
          echo "--> cada -l tem biblioteca de verdade (nao só o symlink do -dev)."
          SYSROOT=/tmp/wm-sysroot
          rm -rf "$SYSROOT"
          chmod +x build/media-player-sysroot.sh
          ./build/media-player-sysroot.sh "$SYSROOT"
          WM_SYSROOT="$SYSROOT" WM_OUT=build/walkmam-media ./build/media-player.sh

          echo "--> [media-player] Instalando o binario e o launcher..."
          sudo install -D -m 0755 build/walkmam-media rootfs/usr/local/bin/walkmam-media
          sudo install -D -m 0755 \
            variants/media-player/overlay/usr/local/bin/start-media-player.sh \
            rootfs/usr/local/bin/start-media-player.sh
          sudo install -D -m 0644 \
            variants/media-player/overlay/etc/systemd/system/media-player.service \
            rootfs/etc/systemd/system/media-player.service
          # O logind, por padrão, desliga o aparelho ao ver a tecla de power —
          # isso impediria o toque curto (apagar a tela) de funcionar.
          sudo install -D -m 0644 \
            variants/media-player/overlay/etc/systemd/logind.conf.d/10-walkmam-media-power.conf \
            rootfs/etc/systemd/logind.conf.d/10-walkmam-media-power.conf

          echo "--> [media-player] Pastas de midia (FAT para copiar do PC, ext4 para scp)..."
          echo "--> /boot/media: o unico lugar que se abre sem rede (a X35H tem o"
          echo "--> USB sem dados, entao copiar midia pelo cartao e o caminho real)."
          sudo mkdir -p rootfs/storage/media/music rootfs/storage/media/videos
          sudo chroot rootfs systemctl enable media-player.service

          echo "--> [media-player] Conferindo que o binario roda (qemu-arm64)..."
          sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/ 2>/dev/null || true
          if sudo chroot rootfs /usr/local/bin/walkmam-media --version; then
            echo "--> ok: o binario executa e responde --version"
          else
            echo "!!! o binario nao executou no rootfs" >&2
            exit 1
          fi
        fi

        echo "--> Instalando o painel web (Wi-Fi/Bluetooth) na porta 8088..."
        echo "--> O Kodi não gerencia rádio; o painel fica acessível em"
        echo "--> http://10.55.0.1:8088 (cabo) ou no IP do Wi-Fi, sem sair do Kodi."
        sudo install -D -m 0644 \
          variants/kodi/overlay/usr/local/share/walkmam-webui/index.html \
          rootfs/usr/local/share/walkmam-webui/index.html
        for cgi in wifi.sh bt.sh; do
          sudo install -D -m 0755 \
            "variants/kodi/overlay/usr/local/share/walkmam-webui/cgi-bin/$cgi" \
            "rootfs/usr/local/share/walkmam-webui/cgi-bin/$cgi"
        done
        sudo install -D -m 0644 \
          variants/kodi/overlay/etc/systemd/system/walkmam-webui.service \
          rootfs/etc/systemd/system/walkmam-webui.service
        sudo chroot rootfs systemctl enable walkmam-webui.service

        echo "--> Instalando o retry de rádio (Wi-Fi/BT podem falhar no 1º probe)..."
        sudo install -D -m 0755 \
          variants/kodi/overlay/usr/local/bin/radio-retry.sh \
          rootfs/usr/local/bin/radio-retry.sh
        sudo install -D -m 0644 \
          variants/kodi/overlay/etc/systemd/system/walkmam-radio-retry.service \
          rootfs/etc/systemd/system/walkmam-radio-retry.service
        sudo chroot rootfs systemctl enable walkmam-radio-retry.service

        echo "--> Instalando o usb-watch (diagnostico do USB na X35S/X35H)..."
        echo "--> Grava em /boot/usb-watch.log o que o kernel ve quando o cabo e"
        echo "--> plugado. Sem isso, 'o PC nao mostra nada' nao diz se a porta e de"
        echo "--> carga, se o cabo e de carga ou se os dados estao em outro PHY."
        sudo install -D -m 0755 \
          variants/kodi/overlay/usr/local/bin/usb-watch.sh \
          rootfs/usr/local/bin/usb-watch.sh
        sudo install -D -m 0644 \
          variants/kodi/overlay/etc/systemd/system/walkmam-usb-watch.service \
          rootfs/etc/systemd/system/walkmam-usb-watch.service
        sudo chroot rootfs systemctl enable walkmam-usb-watch.service

        echo "--> Conferindo os binários que o painel usa (resolve o PATH real do rootfs)..."
        if ! sudo chroot rootfs sh -c '
              for b in busybox wpa_supplicant nmcli bluetoothctl rfkill iw; do
                command -v "$b" >/dev/null 2>&1 || { echo "faltando: $b" >&2; exit 1; }
              done
              busybox --list | grep -qx httpd || { echo "busybox sem applet httpd" >&2; exit 1; }
            '; then
          echo "!!! O painel web nao vai funcionar: binario/applet ausente no rootfs." >&2
          exit 1
        fi
        echo "--> ok: busybox(httpd), wpa_supplicant, nmcli, bluetoothctl, rfkill, iw"

        echo "--> Instalando módulos do kernel no RootFS..."
        cd kernel
        sudo make ARCH=arm64 INSTALL_MOD_PATH=../rootfs modules_install
        cd ..

    - name: Create SD Card Image (.img)
      run: |
        # sudo limpa o ambiente, então a variante vai explícita para dentro do
        # script (senão o nome da imagem sairia sempre com o padrão).
        sudo env VARIANT="$VARIANT" bash << 'EOF'
        set -e

        # kodi mantém o nome histórico do artefato (é o que já se usa para testar
        # no aparelho); as demais variantes ganham o próprio nome.
        if [ "${VARIANT:-kodi}" = "kodi" ]; then
          IMAGE_NAME="rk3566-x55-mainline-sdcard.img"
        else
          IMAGE_NAME="rk3566-x55-${VARIANT}-sdcard.img"
        fi
        echo "--> imagem: $IMAGE_NAME (variante ${VARIANT:-kodi})"
        # 3584 MiB (3,5 GiB) e o teto: o eMMC destas placas tem 3776 MiB, e uma
        # imagem maior NAO cabe nele (o dd morreria no meio e deixaria o eMMC com
        # instalacao corrompida). A raiz usada e ~1,3 GB, entao sobra folga.
        # Para cartoes grandes, aumente com WALKMAM_IMAGE_SIZE_MB.
        IMAGE_SIZE_MB=${WALKMAM_IMAGE_SIZE_MB:-3584}

        echo "--> Criando arquivo de imagem vazio (${IMAGE_SIZE_MB}MB)..."
        dd if=/dev/zero of=${IMAGE_NAME} bs=1M count=${IMAGE_SIZE_MB} status=progress

        echo "--> Criando tabela de partições MBR..."
        parted -s ${IMAGE_NAME} mklabel msdos
        parted -s ${IMAGE_NAME} mkpart primary fat32 16MiB 144MiB
        parted -s ${IMAGE_NAME} mkpart primary ext4 144MiB 100%

        echo "--> Mapeando partições para loop devices..."
        LOOP_DEV=$(losetup -fP --show ${IMAGE_NAME})
        BOOT_DEV="${LOOP_DEV}p1"
        ROOT_DEV="${LOOP_DEV}p2"

        echo "--> Formatando partições..."
        mkfs.vfat -F 32 -n "BOOT" ${BOOT_DEV}
        mkfs.ext4 -F -L "ROOTFS" ${ROOT_DEV}

        # root= das entradas de boot. NAO usar /dev/mmcblk1p2: a imagem roda em
        # tres midias diferentes e o nome do dispositivo muda (ver abaixo).
        # PARTUUID e o mesmo em qualquer midia porque e gravado junto com a
        # imagem, entao a MESMA imagem boota no eMMC, no SD1 e no SD2.
        #
        # O PARTUUID de uma tabela DOS/MBR e "<assinatura do disco>-<NN>", e a
        # assinatura sai do proprio arquivo da imagem (sfdisk --disk-id), SEM
        # abrir o dispositivo de loop. Isso importa: rodar `blkid` na particao do
        # loop logo depois do mkfs fazia o kernel/udev reler a tabela e derrubar
        # /dev/loop0p1, e o mount seguinte falhava com
        #   mount: /mnt/boot: special device /dev/loop0p1 does not exist
        # (aconteceu no run #124). A regra foi conferida contra o blkid:
        #   sfdisk --disk-id -> 0xd2ee80d2   blkid PTUUID -> d2ee80d2
        DISK_ID=$(sfdisk --disk-id "${IMAGE_NAME}" 2>/dev/null | tr -d '[:space:]')
        DISK_ID=${DISK_ID#0x}
        case "$DISK_ID" in
          [0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]) ;;
          *)
            echo "!!! assinatura de disco invalida em ${IMAGE_NAME}: '${DISK_ID}'" >&2
            exit 1
            ;;
        esac
        if [ "$DISK_ID" = "00000000" ]; then
          echo "!!! assinatura de disco zerada; o kernel nao resolveria root=PARTUUID" >&2
          exit 1
        fi
        ROOT_UUID="${DISK_ID}-02"
        echo "--> root=PARTUUID=${ROOT_UUID}"

        echo "--> Gravando U-Boot mainline nos setores corretos..."
        # idbloader.img: SPL/TPL -> setor 64  (offset 32KB)
        # u-boot.itb:    U-Boot proper -> setor 16384 (offset 8MB)
        dd if=uboot/idbloader.img of=${LOOP_DEV} seek=64 conv=notrunc,fsync
        dd if=uboot/u-boot.itb of=${LOOP_DEV} seek=16384 conv=notrunc,fsync

        echo "--> Montando partições..."
        mkdir -p /mnt/boot /mnt/rootfs

        # O dd no dispositivo inteiro (U-Boot) pode fazer o kernel/udev reler a
        # tabela de particoes e derrubar os nos /dev/loop0pN — foi o que falhou
        # no run #124. Antes de montar: re-le a tabela, espera os nos voltarem e,
        # se nao voltarem, recria pelo major:minor do sysfs (mesma tecnica do
        # build/create-image.sh).
        _mknod_part() {
          [ -b "$2" ] && return 0
          _devf="/sys/block/$(basename ${LOOP_DEV})/$(basename ${LOOP_DEV})p$1/dev"
          [ -r "$_devf" ] || return 1
          IFS=: read -r _maj _min < "$_devf"
          mknod "$2" b "$_maj" "$_min"
        }
        for _tent in $(seq 1 10); do
          [ -b ${BOOT_DEV} ] && [ -b ${ROOT_DEV} ] && break
          partprobe ${LOOP_DEV} 2>/dev/null || true
          _mknod_part 1 ${BOOT_DEV} || true
          _mknod_part 2 ${ROOT_DEV} || true
          sleep 1
        done
        if [ ! -b ${BOOT_DEV} ] || [ ! -b ${ROOT_DEV} ]; then
          echo "!!! particoes do loop nao apareceram: ${BOOT_DEV} / ${ROOT_DEV}" >&2
          ls -l /dev/loop* 2>/dev/null | head -10 >&2
          ls /sys/block/$(basename ${LOOP_DEV})/ 2>/dev/null >&2
          exit 1
        fi

        mount ${BOOT_DEV} /mnt/boot
        mount ${ROOT_DEV} /mnt/rootfs

        # Confere que o root= que vai no extlinux aponta para a particao que a
        # gente acabou de formatar — erro aqui e aparelho que nao inicia.
        _real_partuuid=$(blkid -s PARTUUID -o value ${ROOT_DEV} 2>/dev/null || true)
        if [ -n "$_real_partuuid" ] && [ "$_real_partuuid" != "$ROOT_UUID" ]; then
          echo "!!! root=PARTUUID=${ROOT_UUID} nao bate com a particao (${_real_partuuid})" >&2
          exit 1
        fi
        echo "--> PARTUUID conferido: ${_real_partuuid:-${ROOT_UUID}}"

        echo "--> Copiando kernel e device trees (X55 + X35S/X35H)..."
        cp kernel/arch/arm64/boot/Image /mnt/boot/
        mkdir -p /mnt/boot/dtbs
        cp kernel/arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dtb /mnt/boot/dtbs/
        cp kernel/arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dtb /mnt/boot/dtbs/rk3566-powkiddy-x35s-nosso.dtb 2>/dev/null || true

        X35S_DEFAULT="dtbs/rk3566-powkiddy-x35s-nosso.dtb"
        if [ -f rocknix-official-x35s.dtb ]; then
          echo "--> Usando o .dtb OFICIAL da ROCKNIX como padrão pra X35S/X35H (mais completo:"
          echo "--> tem botões/analógico e USB funcionando, confirmados no release deles)."
          cp rocknix-official-x35s.dtb /mnt/boot/dtbs/rk3566-powkiddy-x35s-rocknix.dtb
          X35S_DEFAULT="dtbs/rk3566-powkiddy-x35s-rocknix.dtb"
        else
          echo "!!! .dtb oficial da ROCKNIX não foi obtido — usando o nosso (incompleto: sem"
          echo "!!! botões/analógico, USB com erro de ep0out)."
        fi

        # ------------------------------------------------------------------
        # Variantes de DTB com o papel do USB fixado em "peripheral".
        #
        # O controlador e o DWC3 `usb@fcc00000`; o SoC (rk356x.dtsi) o define como
        # dr_mode="otg", entao o papel depende da deteccao do cabo. Na X55 isso
        # resolve para "device" e o g_ether ancora. Na X35S/X35H o MESMO DTB nao
        # resolve: o kernel loga
        #     dwc3 fcc00000.usb: failed to enable ep0out
        # que e o que acontece quando o gadget tenta iniciar com o controlador em
        # modo host (o DEPCMD de ep0out nunca completa). Forcar
        # dr_mode="peripheral" tira a deteccao de papel da jogada.
        # ------------------------------------------------------------------
        gerar_variante_usb() {
          origem=$1
          destino=$2
          tmpdts="/tmp/$(basename "$destino" .dtb).dts"
          [ -f "$origem" ] || { echo "!!! origem ausente: $origem" >&2; return 1; }
          if ! dtc -I dtb -O dts -o "$tmpdts" "$origem" 2>/dev/null; then
            echo "!!! nao consegui desmontar $origem" >&2; return 1
          fi
          awk '
            /usb@fcc00000[ \t]*\{/ { inblk=1; depth=1; found=0; print; next }
            inblk {
              n=gsub(/\{/,"{"); depth+=n
              n=gsub(/\}/,"}"); depth-=n
              if ($0 ~ /dr_mode = /) { sub(/dr_mode = "[a-zA-Z]*";/, "dr_mode = \"peripheral\";"); found=1 }
              if (depth<=0 && !found) { print "\t\tdr_mode = \"peripheral\";" }
              print
              if (depth<=0) inblk=0
              next
            }
            { print }
          ' "$tmpdts" > "$tmpdts.new"
          if ! dtc -I dts -O dtb -o "$destino" "$tmpdts.new" 2>/dev/null; then
            echo "!!! nao consegui recompilar $destino" >&2; return 1
          fi
          # Confere no binario final (nao no texto): se nao ficou "peripheral", a
          # variante e inutil e e melhor falhar agora do que no aparelho.
          if dtc -I dtb -O dts "$destino" 2>/dev/null \
               | grep -A8 'usb@fcc00000' | grep -q 'dr_mode = "peripheral"'; then
            echo "--> variante USB peripheral ok: $(basename "$destino")"
            return 0
          fi
          echo "!!! $(basename "$destino") ficou sem dr_mode=\"peripheral\"" >&2
          return 1
        }

        # X35S/X35H: variante peripheral e a NOVA PADRAO da entrada x35s.
        PERIPH_FDT=""
        X35S_DTB_FILE="/mnt/boot/${X35S_DEFAULT}"
        if [ -f "$X35S_DTB_FILE" ]; then
          if gerar_variante_usb "$X35S_DTB_FILE" \
               "/mnt/boot/dtbs/$(basename "${X35S_DTB_FILE%.dtb}")-peripheral.dtb"; then
            PERIPH_FDT="/dtbs/$(basename "${X35S_DTB_FILE%.dtb}")-peripheral.dtb"
          else
            echo "!!! Sem a variante peripheral; a entrada x35s fica no DTB original (otg)."
          fi
        fi

        # X55: continua com "otg" por padrao (funciona), mas mantem a variante
        # como caminho de teste.
        X55_PERIPH_FDT=""
        if [ -f /mnt/boot/dtbs/rk3566-powkiddy-x55.dtb ]; then
          if gerar_variante_usb /mnt/boot/dtbs/rk3566-powkiddy-x55.dtb \
               /mnt/boot/dtbs/rk3566-powkiddy-x55-peripheral.dtb; then
            X55_PERIPH_FDT="/dtbs/rk3566-powkiddy-x55-peripheral.dtb"
          fi
        fi

        # O boot le este extlinux.conf; se o FDT apontar para um arquivo que nao
        # existe, o aparelho acende o LED e fica sem imagem. Falha rapido se o
        # device tree ativo (o da X55, aparelho em teste) nao tiver sido gerado.
        if [ ! -f /mnt/boot/dtbs/rk3566-powkiddy-x55.dtb ]; then
          echo "!!! FDT ativo ausente: dtbs/rk3566-powkiddy-x55.dtb." >&2
          echo "!!! Sem o device tree da X55 o aparelho nao tem imagem (LED aceso, tela preta)." >&2
          exit 1
        fi
        # X35S/X35H compartilham o mesmo DTB; sem ele a imagem ainda serve a X55,
        # mas a entrada alternativa da X35S/X35H ficaria quebrada — apenas avisa.
        if [ ! -f "/mnt/boot/${X35S_DEFAULT}" ]; then
          echo "!!! AVISO: DTB da X35S/X35H ausente (${X35S_DEFAULT}); so a X55 bootara." >&2
        fi

        echo "--> Gravando walkmam.conf (rotação da interface Kodi; editável no PC)..."
        cat << 'WALKMAMCONF' > /mnt/boot/walkmam.conf
        # Configuração editável do Walkmam. Lida no boot por start-kodi-wayland.sh.
        #
        # display_transform: auto | normal | rotate-90 | rotate-180 | rotate-270 |
        #                    flipped | flipped-rotate-90 | flipped-rotate-180 |
        #                    flipped-rotate-270
        #
        # "auto" escolhe pelo modelo lido do device tree em uso:
        #   X55        -> rotate-90  (painel 720x1280 montado deitado)
        #   X35S/X35H  -> normal     (painel 640x480)
        # Assim a MESMA imagem serve nos três aparelhos sem editar nada à mão.
        # Um valor explícito sempre vence o "auto".
        display_transform=auto

        # retroarch_exit: só na variante retroarch. O que fazer quando o
        # RetroArch e fechado pelo menu ("Quit RetroArch" - o 1.14 nao tem item
        # de desligar). "poweroff" desliga o aparelho; "stay" apenas sai do app,
        # util para depurar por SSH/serial.
        retroarch_exit=poweroff

        # --- variante media-player (app de midia unico) ---
        # media_volume: volume inicial (0..100).
        # media_audio_out: dispositivo ALSA ("default", "hw:0,0") ou "-" para
        #                  nao abrir o som (util para testar no PC).
        # media_roots: pastas de midia separadas por ':'.
        # media_exit: o que fazer quando a UI termina — poweroff (padrao) ou stay.
        media_volume=70
        media_audio_out=default
        media_roots=/storage/media:/boot/media:/storage/sdcard1/media:/storage/sdcard2/media
        media_exit=poweroff
        WALKMAMCONF

        # ROMs na partição FAT: é o ÚNICO lugar que se lê de um PC sem rede.
        # Essencial na X35H, onde o USB não ancora. Limite prático ~90 MB (o
        # resto vai para kernel/dtbs numa partição de 128 MB); para bibliotecas
        # grandes o caminho é Wi-Fi + scp para /storage/roms.
        if [ "${VARIANT:-kodi}" = "media-player" ]; then
          echo "--> Criando /media na particao FAT (copie musica/video por la, no PC)..."
          mkdir -p /mnt/boot/media/music /mnt/boot/media/videos
          cat << "LEIAME" > /mnt/boot/media/LEIA-ME.txt
        MIDIA: copie as pastas aqui na particao BOOT (no PC), assim:
          media/music/    suas musicas  (mp3, flac, ogg, m4a, wav...)
          media/videos/   seus videos   (mp4, mkv, webm, avi...)

        A ordem que o app procura (a primeira que existir manda):
          /storage/media        (ext4, via Wi-Fi + scp — melhor para muita coisa)
          /boot/media           (esta pasta: le no PC, sem precisar de rede)
          /storage/sdcard1/media e /storage/sdcard2/media  (cartao de dados)

        Tags de musica: ID3v2/ID3v1 (mp3) e Vorbis comment (flac) sao lidas; sem
        tag ele usa "Artista - Titulo.mp3". A capa e folder.jpg/cover.png na
        pasta do album.

        Limite: esta particao tem 128 MB no total (kernel e dtbs ocupam parte).
        Para biblioteca grande use o cartao de dados ou /storage/media.

        Controle: A abre, B volta, L/R trocam de aba, X toca/pausa, Y menu.
        LEIAME
          echo "--> /media criado com LEIA-ME.txt"
        fi

        if [ "${VARIANT:-kodi}" = "retroarch" ]; then
          echo "--> Criando /roms na partição FAT (copie ROMs por lá, no PC)..."
          mkdir -p /mnt/boot/roms
          cat << "LEIAME" > /mnt/boot/roms/LEIA-ME.txt
        ROMs: copie os arquivos aqui, nesta pasta "roms" da partição BOOT, e o
        RetroArch os encontra no menu (Load Content -> /boot/roms).

        Organize por sistema, por exemplo:
          roms/nes/        Super Mario Bros.nes
          roms/snes/       jogo.sfc
          roms/gb/         jogo.gb
          roms/gba/        jogo.gba
          roms/pce/        jogo.pce
          roms/psx/        jogo.cue + jogo.bin

        Limite: esta partição tem 128 MB no total (o kernel ocupa boa parte).
        Para bibliotecas maiores, conecte o Wi-Fi e use scp para /storage/roms,
        que fica na partição grande (ext4).

        PlayStation 1 precisa de BIOS em /storage/bios
        (scph5500.bin, scph5501.bin ou scph5502.bin). A BIOS não vem com o
        sistema; coloque a sua.

        Saves e savestates ficam em /storage/saves e /storage/states (ext4),
        não aqui.
        LEIAME
          echo "--> /roms criado com LEIA-ME.txt"
        fi

        echo "--> Criando extlinux.conf ativo para a Powkiddy X55 (aparelho em teste)..."
        mkdir -p /mnt/boot/extlinux
        # Sem aspas no delimitador para expandir $VARIANT (senão o rótulo diria
        # sempre "Kodi", mesmo na imagem de jogos).
        cat << BOOTCFG > /mnt/boot/extlinux/extlinux.conf
        LABEL Walkmam (Powkiddy X55 - ${VARIANT:-kodi})
            KERNEL /Image
            FDT /dtbs/rk3566-powkiddy-x55.dtb
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=PARTUUID=${ROOT_UUID} rw walkmam_x55_gamepad=rocknix-v1
        BOOTCFG

        # Referência: variante usando o nosso próprio .dtb compilado, caso o
        # oficial da ROCKNIX dê algum problema de incompatibilidade.
        cat << BOOTCFG3 > /mnt/boot/extlinux/extlinux.conf.x35s-nosso
        LABEL Mainline (X35S - nosso .dtb)
            KERNEL /Image
            FDT /dtbs/rk3566-powkiddy-x35s-nosso.dtb
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=PARTUUID=${ROOT_UUID} rw
        BOOTCFG3

        # Mesma imagem serve para X35S/X35H (mesmo DTB): no PC (partição FAT),
        # copie o conteúdo deste arquivo por cima de extlinux.conf e ajuste
        # display_transform=normal em walkmam.conf.
        # X35S/X35H: o padrao continua sendo o dr_mode do SoC ("otg"), que e o que
        # preserva o modo *host* (pendrive/teclado). Testado no X35H: o DTB com
        # "peripheral" NAO resolveu ("PC nao ve nenhum dispositivo"), entao nao
        # trocamos o padrao por uma hipotese — a variante fica como alternativa.
        cat << X35SBOOT > /mnt/boot/extlinux/extlinux.conf.x35s
        LABEL Walkmam (Powkiddy X35S / X35H)
            KERNEL /Image
            FDT /${X35S_DEFAULT}
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=PARTUUID=${ROOT_UUID} rw
        X35SBOOT

        if [ -n "$PERIPH_FDT" ]; then
          cat << PERIPHBOOT > /mnt/boot/extlinux/extlinux.conf.x35s-peripheral
        LABEL Walkmam (X35H/X35S - USB peripheral, teste)
            KERNEL /Image
            FDT $PERIPH_FDT
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=PARTUUID=${ROOT_UUID} rw
        PERIPHBOOT
          echo "--> Alternativa de boot gravada: extlinux/extlinux.conf.x35s-peripheral"
        fi

        if [ -n "$X55_PERIPH_FDT" ]; then
          cat << X55PERIPH > /mnt/boot/extlinux/extlinux.conf.x55-peripheral
        LABEL Walkmam (Powkiddy X55 - USB peripheral, teste)
            KERNEL /Image
            FDT $X55_PERIPH_FDT
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=PARTUUID=${ROOT_UUID} rw walkmam_x55_gamepad=rocknix-v1
        X55PERIPH
          echo "--> Alternativa de boot gravada: extlinux/extlinux.conf.x55-peripheral"
        fi

        echo "--> Copiando rootfs..."
        cp -a rootfs/* /mnt/rootfs/

        echo "--> Desmontando e limpando..."
        umount /mnt/boot
        umount /mnt/rootfs
        losetup -d ${LOOP_DEV}

        echo "--> Compactando imagem final..."
        echo "--> espaco em disco antes do gzip:"; df -h . | tail -1
        gzip -f ${IMAGE_NAME}
        # Marcador de FIM. Se o log de um run parar em "Compactando imagem final"
        # sem esta linha, a run foi CANCELADA no meio (concurrency: um push novo na
        # main cancela o anterior) — nao e falha de build. Ver AGENTS.md §5.
        echo "--> imagem pronta: ${IMAGE_NAME}.gz ($(du -h ${IMAGE_NAME}.gz | cut -f1))"
        echo "--> espaco em disco depois:"; df -h . | tail -1
        EOF

    - name: Prepare Output Directory
      run: |
        mkdir -p output
        mv ./*.img.gz output/

    - name: Upload SD Card Image Artifact
      uses: actions/upload-artifact@v4
      with:
        # Nome por variante: kodi mantém o histórico (é o que o aparelho usa para
        # testar) e retroarch ganha o seu, para não confundir as duas imagens.
        name: ${{ env.VARIANT == 'kodi' && 'rk3566-x55-mainline-sdcard-image' || format('rk3566-x55-{0}-sdcard-image', env.VARIANT) }}
        path: output/*.img.gz

    - name: Gerar checksum SHA256 da imagem
      run: |
        cd output
        # Checksum por arquivo (e não um SHA256SUMS único) para o release rolante
        # poder receber as duas variantes sem um sobrescrever o checksum do outro.
        for f in *.img.gz; do
          sha256sum "$f" > "$f.sha256"
        done
        ls -la
        cat ./*.sha256

    # ---------------------------------------------------------------------
    # Publicação no GitHub Releases
    #
    # O artefato do Actions expira (90 dias) e exige login para baixar. O
    # release publica o MESMO arquivo .img.gz da imagem de cartão SD — não é
    # um ISO9660 (o U-Boot é gravado nos setores 64 e 16384 do disco, então
    # um ISO comum não inicializa o aparelho).
    #
    #   * tag v* ou retroarch-* -> release com o nome da tag (versão);
    #   * push na main          -> release rolante "latest" (pre-release),
    #                              com os assets sobrescritos a cada build.
    # ---------------------------------------------------------------------
    - name: Publicar release da tag
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="${GITHUB_REF#refs/tags/}"
        NOTES="$(mktemp)"
        cat > "$NOTES" << NOTES
        Imagem de cartão SD para RK3566 — variante **${VARIANT}**.

        - Commit: ${GITHUB_SHA}
        - Build: [run ${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

        **Não é um ISO9660.** Grave o arquivo .img.gz direto no cartão SD com
        balenaEtcher, Rufus (modo DD) ou gunzip -c imagem.img.gz | sudo dd of=/dev/sdX bs=4M.
        O U-Boot é gravado nos setores 64 e 16384 do disco; um ISO comum não
        inicializa o aparelho.

        Confira a integridade com: sha256sum -c imagem.img.gz.sha256
        NOTES
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release edit "$TAG" --notes-file "$NOTES"
        else
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
        fi
        gh release upload "$TAG" output/*.img.gz output/*.sha256 --clobber

    - name: Publicar release rolante latest (main)
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        NOTES="$(mktemp)"
        cat > "$NOTES" << NOTES
        Imagem mais recente da branch **main** — variante **${VARIANT}**.

        - Commit: ${GITHUB_SHA}
        - Build: [run ${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

        **Não é um ISO9660.** Grave o arquivo .img.gz direto no cartão SD com
        balenaEtcher, Rufus (modo DD) ou gunzip -c imagem.img.gz | sudo dd of=/dev/sdX bs=4M.
        O U-Boot é gravado nos setores 64 e 16384 do disco; um ISO comum não
        inicializa o aparelho.

        Confira a integridade com: sha256sum -c imagem.img.gz.sha256
        NOTES
        gh release view latest >/dev/null 2>&1 || gh release create latest \
          --target "$GITHUB_SHA" \
          --title "Latest (main)" \
          --prerelease \
          --notes-file "$NOTES"
        gh release upload latest output/*.img.gz output/*.sha256 --clobber
        gh release edit latest --notes-file "$NOTES"
